<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Ejercicio 6.21</title>
</head>
<body>
    <h1>Ejercicio 6.21</h1>
    <script>
        var num = parseInt(window.prompt("Escriba un número entero:"));

        if (num % 2 == 0) {
            document.write("<p>El número " + num + " es par</p>");
        }
        if (num % 2 != 0) {
            document.write("<p>El número " + num + " es impar</p>");
        }
    </script>
</body>
</html>
