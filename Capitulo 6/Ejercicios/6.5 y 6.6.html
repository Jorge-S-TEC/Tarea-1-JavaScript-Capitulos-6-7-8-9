<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Ejercicios 6.5 y 6.6</title>
</head>
<body>
    <h1>Producto de tres enteros</h1>
    <script>
        var x, y, z, resultado;
        var xVal = window.prompt("Escriba el primer valor:");
        var yVal = window.prompt("Escriba el segundo valor:");
        var zVal = window.prompt("Escriba el tercer valor:");

        x = parseInt( xVal );
        y = parseInt( yVal );
        z = parseInt( zVal );

        resultado = x * y * z;
        document.writeln("<h1>El producto es " + resultado + "</h1>");
    </script>
</body>
</html>
