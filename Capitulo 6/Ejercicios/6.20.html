<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Ejercicio 6.20</title>
</head>
<body>
    <h1>Ejercicio 6.20</h1>
    <script>
        var n1 = parseInt(window.prompt("Número 1:"));
        var n2 = parseInt(window.prompt("Número 2:"));
        var n3 = parseInt(window.prompt("Número 3:"));
        var n4 = parseInt(window.prompt("Número 4:"));
        var n5 = parseInt(window.prompt("Número 5:"));

        var menor = n1;
        if (n2 < menor) menor = n2;
        if (n3 < menor) menor = n3;
        if (n4 < menor) menor = n4;
        if (n5 < menor) menor = n5;

        var mayor = n1;
        if (n2 > mayor) mayor = n2;
        if (n3 > mayor) mayor = n3;
        if (n4 > mayor) mayor = n4;
        if (n5 > mayor) mayor = n5;

        document.writeln("<p>El número menor es: " + menor + "</p>");
        document.writeln("<p>El número mayor es: " + mayor + "</p>");
    </script>
</body>
</html>
