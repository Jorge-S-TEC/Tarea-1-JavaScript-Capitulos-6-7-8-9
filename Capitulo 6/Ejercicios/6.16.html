<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Ejercicio 6.16</title>
</head>
<body>
    <h1>Ejercicio 6.16</h1>
    <script>
        var num1 = parseInt(window.prompt("Escriba el primer número:"));
        var num2 = parseInt(window.prompt("Escriba el segundo número:"));

        document.writeln("<p>Suma: " + (num1 + num2) + "</p>");
        document.writeln("<p>Producto: " + (num1 * num2) + "</p>");
        document.writeln("<p>Diferencia: " + (num1 - num2) + "</p>");
        document.writeln("<p>Cociente: " + (num1 / num2) + "</p>");
    </script>
</body>
</html>
