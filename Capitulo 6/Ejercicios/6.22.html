<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Ejercicio 6.22</title>
</head>
<body>
    <h1>Ejercicio 6.22</h1>
    <script>
        var n1 = parseInt(window.prompt("Escriba el primer entero:"));
        var n2 = parseInt(window.prompt("Escriba el segundo entero:"));

        if (n1 % n2 == 0) {
            document.write("<p>El número " + n1 + " sí es múltiplo de " + n2 + "</p>");
        } else {
            document.write("<p>El número " + n1 + " NO es múltiplo de " + n2 + "</p>");
        }
    </script>
</body>
</html>
