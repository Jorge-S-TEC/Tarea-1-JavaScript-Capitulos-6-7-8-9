<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Ejercicio 6.24</title>
    <style>
        table, th, td { border: 1px solid black; border-collapse: collapse; padding: 5px; text-align: center; }
    </style>
</head>
<body>
    <h1>Ejercicio 6.24</h1>
    <script>
        document.writeln("<table>");
        document.writeln("<tr><th>Número</th><th>Cuadrado</th><th>Cubo</th></tr>");
        for (var i = 0; i <= 5; i++) {
            document.writeln("<tr><td>" + i + "</td><td>" + (i * i) + "</td><td>" + (i * i * i) + "</td></tr>");
        }
        document.writeln("</table>");
    </script>
</body>
</html>
