<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Ejercicio 6.13</title>
</head>
<body>
    <h1>Ejercicio 6.13</h1>
    <script>
        var a = 2, x = 3;
        var y = a * x * x * x + 7;
        document.writeln("<p>Instrucción correcta para y = ax^3 + 7:</p>");
        document.writeln("<p><b>y = a * x * x * x + 7;</b></p>");
        document.writeln("<p>Resultado de prueba (con a=2, x=3): " + y + "</p>");
    </script>
</body>
</html>
