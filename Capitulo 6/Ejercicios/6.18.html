<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Ejercicio 6.18</title>
</head>
<body>
    <h1>Ejercicio 6.18</h1>
    <script>
        var a = parseInt(window.prompt("Primer entero:"));
        var b = parseInt(window.prompt("Segundo entero:"));
        var c = parseInt(window.prompt("Tercer entero:"));

        var suma = a + b + c;
        var promedio = suma / 3;
        var producto = a * b * c;

        var menor = a;
        if (b < menor) menor = b;
        if (c < menor) menor = c;

        var mayor = a;
        if (b > mayor) mayor = b;
        if (c > mayor) mayor = c;

        window.alert("Suma: " + suma + "\nPromedio: " + promedio + "\nProducto: " + producto + "\nMenor: " + menor + "\nMayor: " + mayor);
        document.writeln("<p>Suma: " + suma + "</p>");
        document.writeln("<p>Promedio: " + promedio + "</p>");
        document.writeln("<p>Producto: " + producto + "</p>");
        document.writeln("<p>Menor: " + menor + "</p>");
        document.writeln("<p>Mayor: " + mayor + "</p>");
    </script>
</body>
</html>
