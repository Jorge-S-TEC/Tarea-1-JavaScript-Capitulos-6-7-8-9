<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Ejercicio 6.4</title>
</head>
<body>
    <h1>Ejercicio 6.4 (Corrección de errores)</h1>
    <script>
        var c = 5;
        // Corrección a: Se quitó el punto y coma incorrecto después del if
        if ( c < 7 ) {
            document.writeln("<p>a) c es menor que 7</p>");
        }

        // Corrección b: Se cambió => por >=
        if ( c >= 7 ) {
            document.writeln("<p>b) c es igual o mayor que 7</p>");
        } else {
            document.writeln("<p>b) Corrección aplicada: el operador correcto es >= en lugar de =></p>");
        }
    </script>
</body>
</html>
