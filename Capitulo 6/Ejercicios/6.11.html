<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Ejercicio 6.11</title>
</head>
<body>
    <h1>Ejercicio 6.11</h1>
    <script>
        var x = 2;
        var y = 3;
        window.alert("x = " + x);
        window.alert("El valor de x + x es " + (x + x));
        window.alert("x = ");
        window.alert((x + y) + " = " + (y + x));

        document.writeln("<p>Se ejecutaron los 4 diálogos de alerta con x = 2 y y = 3.</p>");
    </script>
</body>
</html>
