<!DOCTYPE html>
<html>
   <head>
      <meta charset="utf-8">
      <title>Ejercicio 9.11 - Rangos de enteros aleatorios</title>
      <script>
         document.writeln("<h1>Instrucciones para generar números aleatorios</h1>");
         document.writeln("<p><strong>a) 1 &le; n &le; 2:</strong> <code>n = Math.floor(1 + Math.random() * 2);</code></p>");
         document.writeln("<p><strong>b) 1 &le; n &le; 100:</strong> <code>n = Math.floor(1 + Math.random() * 100);</code></p>");
         document.writeln("<p><strong>c) 0 &le; n &le; 9:</strong> <code>n = Math.floor(Math.random() * 10);</code></p>");
         document.writeln("<p><strong>d) 1000 &le; n &le; 1112:</strong> <code>n = Math.floor(1000 + Math.random() * 113);</code></p>");
         document.writeln("<p><strong>e) -1 &le; n &le; 1:</strong> <code>n = Math.floor(-1 + Math.random() * 3);</code></p>");
         document.writeln("<p><strong>f) -3 &le; n &le; 11:</strong> <code>n = Math.floor(-3 + Math.random() * 15);</code></p>");
      </script>
   </head>
   <body></body>
</html>
