<!DOCTYPE html>
<html>
   <head>
      <meta charset="utf-8">
      <title>Ejercicio 9.16 - Separación de dígitos</title>
      <script>
         function cocienteEntero(a, b) {
            return Math.floor(a / b);
         }

         function residuoEntero(a, b) {
            return a % b;
         }

         function mostrarDigitos(n) {
            var divisor = 1;
            while (cocienteEntero(n, divisor) >= 10) {
               divisor *= 10;
            }

            var salida = "";
            while (divisor >= 1) {
               salida += cocienteEntero(n, divisor) + "  ";
               n = residuoEntero(n, divisor);
               divisor = cocienteEntero(divisor, 10);
            }
            return salida;
         }

         var entrada = window.prompt("Introduzca un entero entre 1 y 99999:", "4562");
         var num = parseInt(entrada);
         document.writeln("<h1>Dígitos separados por dos espacios:</h1>");
         document.writeln("<pre style='font-size:20px;'>" + mostrarDigitos(num) + "</pre>");
      </script>
   </head>
   <body></body>
</html>
