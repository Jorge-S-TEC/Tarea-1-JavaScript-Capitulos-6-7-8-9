      <title>Ejercicio 9.4 - Conceptos de funciones</title>
      <script>
         document.writeln("<h1>Respuestas del Ejercicio 9.4</h1>");
         document.writeln("<p><strong>a)</strong> El <strong>alcance</strong> (o <em>ámbito / scope</em>) de un identificador es la parte del programa en donde puede usarse.</p>");
         document.writeln("<p><strong>b)</strong> Las tres formas de devolver el control de una función invocada son: " +
            "<strong>llegar a la llave de cierre (})</strong>, " +
            "<strong>ejecutar la instrucción 'return;'</strong> (sin valor), y " +
            "<strong>ejecutar la instrucción 'return expresión;'</strong> (devolviendo un valor).</p>");
         document.writeln("<p><strong>c)</strong> La función <strong>Math.random</strong> se utiliza para producir números aleatorios.</p>");
         document.writeln("<p><strong>d)</strong> Las variables declaradas en un bloque o en la lista de parámetros de una función son de alcance <strong>local</strong> (o de función).</p>");
      </script>
