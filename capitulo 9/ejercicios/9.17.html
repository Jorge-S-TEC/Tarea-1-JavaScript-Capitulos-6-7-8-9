<!DOCTYPE html>
<html>
   <head>
      <meta charset="utf-8">
      <title>Ejercicio 9.17 - Conversión de temperaturas</title>
      <script>
         function aCelsius() {
            var f = parseFloat(document.getElementById("temp").value);
            document.getElementById("salida").innerHTML = 
               "<p>" + f + " °F = <strong>" + celsius(f).toFixed(2) + " °C</strong></p>";
         }

         function aFahrenheit() {
            var c = parseFloat(document.getElementById("temp").value);
            document.getElementById("salida").innerHTML = 
               "<p>" + c + " °C = <strong>" + fahrenheit(c).toFixed(2) + " °F</strong></p>";
         }

         function celsius(f) {
            return (5.0 / 9.0) * (f - 32);
         }

         function fahrenheit(c) {
            return (9.0 / 5.0) * c + 32;
         }
      </script>
   </head>
   <body>
      <h1>Conversión de Temperatura</h1>
      <form action="#">
         Temperatura: <input id="temp" type="number" step="any" value="100">
         <input type="button" value="Convertir a Celsius" onclick="aCelsius()">
         <input type="button" value="Convertir a Fahrenheit" onclick="aFahrenheit()">
      </form>
      <div id="salida"></div>
   </body>
</html>
