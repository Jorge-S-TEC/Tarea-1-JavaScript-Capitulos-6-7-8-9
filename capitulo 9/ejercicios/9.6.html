<!DOCTYPE html>
<html>
   <head>
      <meta charset="utf-8">
      <title>Volumen de una esfera</title>
      <script>
         function iniciar() {
            var boton = document.getElementById("botonCalcular");
            boton.addEventListener("click", calcularVolumen, false);
         }

         function calcularVolumen() {
            var campo = document.getElementById("campoEntrada");
            var radio = parseFloat(campo.value);
            var salida = document.getElementById("resultado");

            if (!isNaN(radio) && radio >= 0) {
               var volumen = volumenEsfera(radio);
               salida.innerHTML = "<p>El volumen de la esfera con radio " + radio + 
                  " es: <strong>" + volumen.toFixed(4) + "</strong></p>";
            } else {
               salida.innerHTML = "<p style='color: red;'>Por favor introduzca un radio numérico válido.</p>";
            }
         }

         function volumenEsfera(radio) {
            return (4.0 / 3.0) * Math.PI * Math.pow(radio, 3);
         }

         window.addEventListener("load", iniciar, false);
      </script>
   </head>
   <body>
      <h1>Cálculo del volumen de una esfera</h1>
      <form action="#">
         <label for="campoEntrada">Radio de la esfera:</label>
         <input id="campoEntrada" type="number" step="any" min="0" placeholder="Ej. 5">
         <input id="botonCalcular" type="button" value="Calcular volumen">
      </form>
      <div id="resultado"></div>
   </body>
</html>
