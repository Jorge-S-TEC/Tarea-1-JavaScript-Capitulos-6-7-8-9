<!DOCTYPE html>
<html>
   <head>
      <meta charset="utf-8">
      <title>Ejercicio 9.18 - Menor de tres números</title>
      <script>
         var n1 = parseFloat(window.prompt("Primer número:", "0"));
         var n2 = parseFloat(window.prompt("Segundo número:", "0"));
         var n3 = parseFloat(window.prompt("Tercer número:", "0"));

         function minimo3(a, b, c) {
            return Math.min(a, Math.min(b, c));
         }

         document.writeln("<h1>El menor de los tres números es: " + minimo3(n1, n2, n3) + "</h1>");
      </script>
   </head>
   <body></body>
</html>
