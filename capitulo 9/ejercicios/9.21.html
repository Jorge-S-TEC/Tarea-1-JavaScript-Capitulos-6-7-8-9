<!DOCTYPE html>
<html>
   <head>
      <meta charset="utf-8">
      <title>Ejercicio 9.21 - Lanzamiento de monedas</title>
      <script>
         var caras = 0, cruces = 0;

         function arrojar() {
            return Math.random() >= 0.5;
         }

         function lanzarMoneda() {
            if (arrojar()) {
               caras++;
            } else {
               cruces++;
            }
            document.getElementById("salida").innerHTML = 
               "<p>Caras: " + caras + " | Cruces: " + cruces + " | Total: " + (caras + cruces) + "</p>";
         }
      </script>
   </head>
   <body>
      <h1>Simulación de Lanzamiento de Monedas</h1>
      <input type="button" value="Lanzar" onclick="lanzarMoneda()">
      <div id="salida"><p>Caras: 0 | Cruces: 0 | Total: 0</p></div>
   </body>
</html>
