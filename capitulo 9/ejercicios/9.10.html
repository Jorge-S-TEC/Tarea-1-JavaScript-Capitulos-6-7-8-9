      <script>
         document.writeln("<h1>Respuestas del Ejercicio 9.10</h1>");
         document.writeln("<p><strong>a) ¿Qué significa elegir números al azar?</strong><br>" +
            "Significa que cada valor dentro de un rango específico tiene exactamente la misma probabilidad de ser seleccionado.</p>");
         document.writeln("<p><strong>b) ¿Por qué es útil Math.random para simular juegos de probabilidad?</strong><br>" +
            "Porque permite modelar eventos estocásticos del mundo real (como lanzar monedas, tirar dados o barajar naipes) con distribuciones uniformes.</p>");
         document.writeln("<p><strong>c) ¿Por qué es a menudo necesario escalar y/o desplazar los valores de Math.random?</strong><br>" +
            "Porque Math.random() genera decimales en el rango [0, 1). Se debe escalar (multiplicar) para ampliar el ancho del rango y desplazar (sumar) para ajustar el valor inicial al intervalo deseado.</p>");
         document.writeln("<p><strong>d) ¿Por qué la simulación computarizada de situaciones reales es útil?</strong><br>" +
            "Porque permite estudiar sistemas complejos, peligrosos, costosos o lentos en un entorno seguro, repetible y económico.</p>");
