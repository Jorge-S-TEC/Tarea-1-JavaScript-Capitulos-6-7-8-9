<!DOCTYPE html>
<html>
   <head>
      <meta charset="utf-8">
      <title>Ejercicio 9.15 - Función esPar</title>
      <script>
         function esPar(numero) {
            return numero % 2 === 0;
         }

         var entrada = window.prompt("Introduzca un entero (o 'fin' para terminar):", "0");
         while (entrada !== null && entrada.toLowerCase() !== "fin") {
            var num = parseInt(entrada);
            if (!isNaN(num)) {
               document.writeln("<p>El número " + num + " es par: <strong>" + esPar(num) + "</strong></p>");
            }
            entrada = window.prompt("Introduzca otro entero ('fin' para terminar):", "0");
         }
      </script>
   </head>
   <body></body>
</html>
