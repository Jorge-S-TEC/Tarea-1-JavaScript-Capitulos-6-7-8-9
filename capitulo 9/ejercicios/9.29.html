<!DOCTYPE html>
<html>
   <head>
      <meta charset="utf-8">
      <title>Ejercicio 9.29 - Potencia recursiva</title>
      <script>
         function potencia(base, exponente) {
            if (exponente === 1) {
               return base;
            } else {
               return base * potencia(base, exponente - 1);
            }
         }

         function calcular() {
            var b = parseInt(document.getElementById("b").value);
            var e = parseInt(document.getElementById("e").value);
            if (e >= 1) {
               document.getElementById("res").innerHTML = 
                  b + "<sup>" + e + "</sup> = <strong>" + potencia(b, e) + "</strong>";
            }
         }
      </script>
   </head>
   <body>
      <h1>Función Recursiva de Potencia</h1>
      Base: <input id="b" type="number" value="3">
      Exponente (&ge; 1): <input id="e" type="number" min="1" value="4">
      <input type="button" value="Calcular" onclick="calcular()">
      <p id="res"></p>
   </body>
</html>
