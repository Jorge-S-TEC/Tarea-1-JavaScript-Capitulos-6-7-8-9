<!DOCTYPE html>
<html>
   <head>
      <meta charset="utf-8">
      <title>Ejercicio 9.19 - Números primos</title>
      <script>
         function esPrimo(n) {
            if (n <= 1) return false;
            var limite = Math.floor(Math.sqrt(n));
            for (var i = 2; i <= limite; ++i) {
               if (n % i === 0) return false;
            }
            return true;
         }

         window.onload = function() {
            var primos = [];
            for (var i = 2; i <= 10000; ++i) {
               if (esPrimo(i)) primos.push(i);
            }
            document.getElementById("salida").value = primos.join(", ");
         };
      </script>
   </head>
   <body>
      <h1>Números primos entre 1 y 10,000</h1>
      <p><em>Nota: Solo es necesario probar hasta &radic;n porque cualquier divisor mayor tiene su factor correspondiente menor a &radic;n.</em></p>
      <textarea id="salida" rows="15" cols="60" readonly></textarea>
   </body>
</html>
