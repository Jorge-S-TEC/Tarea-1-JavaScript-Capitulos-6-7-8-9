
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Frecuencias al tirar los dados</title>

    <style>
        img {
            margin-right: 10px;
            width: 70px;
            height: 70px;
        }

        table {
            width: 300px;
            border-collapse: collapse;
            background-color: lightblue;
            margin-top: 20px;
        }

        table, td, th {
            border: 1px solid black;
            padding: 4px;
        }

        th {
            text-align: left;
            color: white;
            background-color: darkblue;
        }

        caption {
            font-weight: bold;
            margin-bottom: 8px;
        }

        #botonTirar {
            margin-top: 10px;
            padding: 8px 15px;
            cursor: pointer;
        }
    </style>

    <script>
        var frecuencia1 = 0;
        var frecuencia2 = 0;
        var frecuencia3 = 0;
        var frecuencia4 = 0;
        var frecuencia5 = 0;
        var frecuencia6 = 0;
        var totalDados = 0;

        function iniciar() {
            var boton = document.getElementById("botonTirar");

            boton.addEventListener("click", tirarDados, false);
        }

        function tirarDados() {
            var cara;

            for (var i = 1; i <= 12; ++i) {
                cara = Math.floor(1 + Math.random() * 6);

                sumarTiros(cara);
                establecerImagen(i, cara);

                ++totalDados;
            }

            actualizarTablaFrecuencias();
        }

        function sumarTiros(cara) {
            switch (cara) {
                case 1:
                    ++frecuencia1;
                    break;

                case 2:
                    ++frecuencia2;
                    break;

                case 3:
                    ++frecuencia3;
                    break;

                case 4:
                    ++frecuencia4;
                    break;

                case 5:
                    ++frecuencia5;
                    break;

                case 6:
                    ++frecuencia6;
                    break;
            }
        }

        function establecerImagen(numeroDado, cara) {
            var imgDado = document.getElementById("dado" + numeroDado);

            imgDado.setAttribute("src", "dado" + cara + ".png");

            imgDado.setAttribute(
                "alt",
                "Dado con " + cara + " punto(s)"
            );
        }

        function actualizarTablaFrecuencias() {
            var divTabla = document.getElementById("divTablaFrecuencias");

            divTabla.innerHTML =
                "<table>" +
                "<caption>Frecuencias de tiro de los dados</caption>" +

                "<thead>" +
                "<tr>" +
                "<th>Cara</th>" +
                "<th>Frecuencia</th>" +
                "<th>Porcentaje</th>" +
                "</tr>" +
                "</thead>" +

                "<tbody>" +

                "<tr><td>1</td><td>" + frecuencia1 +
                "</td><td>" + formatoPorcentaje(frecuencia1 / totalDados) + "%</td></tr>" +

                "<tr><td>2</td><td>" + frecuencia2 +
                "</td><td>" + formatoPorcentaje(frecuencia2 / totalDados) + "%</td></tr>" +

                "<tr><td>3</td><td>" + frecuencia3 +
                "</td><td>" + formatoPorcentaje(frecuencia3 / totalDados) + "%</td></tr>" +

                "<tr><td>4</td><td>" + frecuencia4 +
                "</td><td>" + formatoPorcentaje(frecuencia4 / totalDados) + "%</td></tr>" +

                "<tr><td>5</td><td>" + frecuencia5 +
                "</td><td>" + formatoPorcentaje(frecuencia5 / totalDados) + "%</td></tr>" +

                "<tr><td>6</td><td>" + frecuencia6 +
                "</td><td>" + formatoPorcentaje(frecuencia6 / totalDados) + "%</td></tr>" +

                "</tbody>" +
                "</table>";
        }

        function formatoPorcentaje(valor) {
            return (valor * 100).toFixed(2);
        }

        window.addEventListener("load", iniciar, false);
    </script>
</head>

<body>

    <h2>Frecuencias al tirar los dados</h2>

    <p>
        <img id="dado1" src="blanco.png" alt="Dado 1">
        <img id="dado2" src="blanco.png" alt="Dado 2">
        <img id="dado3" src="blanco.png" alt="Dado 3">
        <img id="dado4" src="blanco.png" alt="Dado 4">
        <img id="dado5" src="blanco.png" alt="Dado 5">
        <img id="dado6" src="blanco.png" alt="Dado 6">
    </p>

    <p>
        <img id="dado7" src="blanco.png" alt="Dado 7">
        <img id="dado8" src="blanco.png" alt="Dado 8">
        <img id="dado9" src="blanco.png" alt="Dado 9">
        <img id="dado10" src="blanco.png" alt="Dado 10">
        <img id="dado11" src="blanco.png" alt="Dado 11">
        <img id="dado12" src="blanco.png" alt="Dado 12">
    </p>

    <form action="#">
        <input
            id="botonTirar"
            type="button"
            value="Tirar dados"
        >
    </form>

    <div id="divTablaFrecuencias"></div>

</body>
</html>
