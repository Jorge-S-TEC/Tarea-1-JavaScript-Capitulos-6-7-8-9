<!DOCTYPE html>
<html>
   <head>
      <meta charset="utf-8">
      <title>Enteros aleatorios</title>
      <style>
         p, ol { margin: 0; }
         li { display: inline; margin-right: 10px; }
      </style>
      <script>
         var valor;

         document.writeln("<p>Números aleatorios (1 a 6):</p><ol>");

         for (var i = 1; i <= 30; ++i) {
            valor = Math.floor(1 + Math.random() * 6);
            document.writeln("<li>" + valor + "</li>");
         }

         document.writeln("</ol>");
      </script>
   </head>
   <body></body>
</html>
