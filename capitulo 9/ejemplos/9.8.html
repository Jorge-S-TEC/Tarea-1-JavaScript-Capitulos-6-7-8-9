         Un jugador tira dos dados. Cada dado tiene seis caras con números del 1 al 6. 
         Si la suma es 7 u 11 en el primer lanzamiento, el jugador gana. Si es 2, 3 o 12 
         ("craps"), el jugador pierde. Si la suma es 4, 5, 6, 8, 9 o 10, esa suma se 
         convierte en el "punto". El jugador debe seguir tirando hasta sacar su punto para 
         ganar; si saca un 7 antes del punto, pierde.
