<!DOCTYPE html>
<!-- Ejercicio 8.2: instrucciones.html -->
<html>
   <head>
      <meta charset="utf-8">
      <title>Ejercicio 8.2</title>
      <script>
         document.writeln("<h1>Respuestas del Ejercicio 8.2</h1>");

         // a) Sumar enteros impares entre 1 y 99 con un for
         var suma = 0;
         var cuenta;
         for (cuenta = 1; cuenta <= 99; cuenta += 2)
            suma += cuenta;
         document.writeln("<p><strong>a)</strong> Suma de impares del 1 al 99: " + suma + "</p>");

         // b) Calcular 2.5 elevado a la potencia 3
         var potencia = Math.pow(2.5, 3);
         document.writeln("<p><strong>b)</strong> 2.5 elevado a la 3: " + potencia + "</p>");

         // c) Imprimir enteros del 1 al 20 con while (5 por línea)
         document.writeln("<p><strong>c) Enteros del 1 al 20 con while (5 por línea):</strong></p>");
         var x = 1;
         while (x <= 20)
         {
            document.write(x + " ");
            if (x % 5 === 0)
               document.writeln("<br>");
            ++x;
         }

         // d) Repetir el inciso c con un ciclo for
         document.writeln("<p><strong>d) Enteros del 1 al 20 con for (5 por línea):</strong></p>");
         for (var i = 1; i <= 20; ++i)
         {
            document.write(i + " ");
            if (i % 5 === 0)
               document.writeln("<br>");
         }
      </script>
   </head>
   <body></body>
</html>
