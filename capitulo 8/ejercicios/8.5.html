<!DOCTYPE html>
<!-- Ejercicio 8.5: ej08_05.html -->
<html>
   <head>
      <meta charset = "utf-8">
      <title>Misterio</title>
      <style>
         table { border-collapse: collapse; margin-top: 10px; }
         td { border: 1px solid #555; padding: 6px 12px; text-align: center; }
      </style>
      <script>
         document.writeln( "<h1>¿Qué hace el programa?</h1>" );
         document.writeln( "<p>Genera una tabla HTML de 10 filas por 5 columnas, donde cada celda muestra su coordenada (fila, columna):</p>" );

         document.writeln( "<table>" );

         for ( var i = 1; i <= 10; i++ )
         {
            document.writeln( "<tr>" );

            for ( var j = 1; j <= 5; j++ )
               document.writeln( "<td>(" + i + ", " + j + ")</td>" );

            document.writeln( "</tr>" );
         } // fin de for

         document.writeln( "</table>" );

      </script>
   </head>
   <body></body>
</html>
