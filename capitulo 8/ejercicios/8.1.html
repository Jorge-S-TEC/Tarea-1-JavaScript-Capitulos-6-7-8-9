<!DOCTYPE html>
<!-- Ejercicio 8.1: autoevaluacion.html -->
<html>
   <head>
      <meta charset="utf-8">
      <title>Ejercicio 8.1 - Verdadero o Falso</title>
      <script>
         document.writeln("<h1>Respuestas del Ejercicio 8.1</h1>");
         document.writeln("<p><strong>a) El caso default es requerido en switch:</strong><br>" +
            "<em>Falso.</em> El caso default es opcional, aunque es una buena práctica de programación incluirlo.</p>");
         document.writeln("<p><strong>b) La instrucción break es requerida en el último caso de switch:</strong><br>" +
            "<em>Falso.</em> No es obligatoria en el último caso porque la ejecución sale automáticamente del switch, aunque se recomienda por claridad y consistencia.</p>");
         document.writeln("<p><strong>c) ( x > y && a < b ) es verdadera si x > y es verdadera, o si a < b es verdadera:</strong><br>" +
            "<em>Falso.</em> El operador && (AND lógico) requiere que <strong>ambas</strong> condiciones sean verdaderas para que toda la expresión sea verdadera.</p>");
         document.writeln("<p><strong>d) Una expresión con el operador || es verdadera si uno o ambos operandos son verdaderos:</strong><br>" +
            "<em>Verdadero.</em></p>");
      </script>
   </head>
   <body></body>
</html>
