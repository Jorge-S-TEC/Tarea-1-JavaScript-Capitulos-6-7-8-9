<!DOCTYPE html>
<!-- Ejercicio 8.11: ventas_productos.html -->
<html>
   <head>
      <meta charset="utf-8">
      <title>Cálculo de ventas totales</title>
      <script>
         var totalVentas = 0.0;
         var entrada = window.prompt("Número de producto (1 a 5, o -1 para terminar):", "1");
         var numProducto = parseInt(entrada);

         while (numProducto !== -1)
         {
            var cantidad = parseInt(window.prompt("Cantidad vendida del producto " + numProducto + ":", "1"));
            var precio = 0.0;

            switch (numProducto)
            {
               case 1:
                  precio = 2.98;
                  break;
               case 2:
                  precio = 4.50;
                  break;
               case 3:
                  precio = 9.98;
                  break;
               case 4:
                  precio = 4.49;
                  break;
               case 5:
                  precio = 6.87;
                  break;
               default:
                  window.alert("Número de producto inválido: " + numProducto);
                  precio = 0.0;
                  break;
            }

            totalVentas += precio * cantidad;

            entrada = window.prompt("Número de producto (1 a 5, o -1 para terminar):", "1");
            numProducto = parseInt(entrada);
         }

         document.writeln("<h1>Resumen de Ventas</h1>");
         document.writeln("<p>El valor total de venta de todos los productos vendidos la semana pasada es: <strong>$" + totalVentas.toFixed(2) + "</strong></p>");
      </script>
   </head>
   <body></body>
</html>
