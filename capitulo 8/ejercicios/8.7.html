<!DOCTYPE html>
<!-- Ejercicio 8.7: producto_impares.html -->
<html>
   <head>
      <meta charset="utf-8">
      <title>Producto de enteros impares del 1 al 15</title>
      <script>
         var producto = 1;

         for (var i = 1; i <= 15; i += 2)
         {
            producto *= i;
         }

         document.writeln("<h1>Cálculo del producto</h1>");
         document.writeln("<p>Operación: 1 &times; 3 &times; 5 &times; 7 &times; 9 &times; 11 &times; 13 &times; 15</p>");
         document.writeln("<p>El producto de los enteros impares del 1 al 15 es: <strong>" + producto + "</strong></p>");
      </script>
   </head>
   <body></body>
</html>
