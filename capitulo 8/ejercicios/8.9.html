<!DOCTYPE html>
<!-- Ejercicio 8.9: histograma.html -->
<html>
   <head>
      <meta charset="utf-8">
      <title>Gráfico de barras (Histograma)</title>
      <style>
         body { font-family: monospace; font-size: 16px; }
      </style>
      <script>
         document.writeln("<h1>Gráfico de barras (Histograma)</h1>");

         for (var i = 1; i <= 5; ++i)
         {
            var numero = parseInt(window.prompt("Introduzca el número " + i + " de 5 (entre 1 y 30):", "5"));

            document.write(numero + ": ");
            for (var j = 1; j <= numero; ++j)
            {
               document.write("*");
            }
            document.writeln("<br>");
         }
      </script>
   </head>
   <body></body>
</html>
