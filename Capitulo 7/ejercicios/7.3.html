<!DOCTYPE html>
<!-- Ejercicio 7.3: instrucciones.html -->
<html>
   <head>
      <meta charset="utf-8">
      <title>Ejercicio 7.3</title>
      <script>
         var x = 5, y = 3, z;
         var cuenta = 15;
         var total = 20;
         var q = 17, divisor = 5;

         // a) Asignar suma de x y y a z, e incrementar x después
         z = x++ + y;

         // b) Evaluar cuenta > 10
         if (cuenta > 10)
            document.writeln("<p>Cuenta es mayor que 10</p>");

         // c) Decrementar x en 1 y restarla a total
         total -= --x;

         // d) Residuo de q entre divisor (forma 1: %=, forma 2: %)
         q %= divisor;

         document.writeln("<p>Valor de z: " + z + "</p>");
         document.writeln("<p>Valor de total: " + total + "</p>");
         document.writeln("<p>Valor de q: " + q + "</p>");
      </script>
   </head>
   <body></body>
</html>
