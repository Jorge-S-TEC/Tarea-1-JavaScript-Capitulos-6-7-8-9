<!DOCTYPE html>
<!-- Ejercicio 7.4: suma_instrucciones.html -->
<html>
   <head>
      <meta charset="utf-8">
      <title>Ejercicio 7.4</title>
      <script>
         // a) Declarar variables
         var suma, x;

         // b) Asignar 1 a x
         x = 1;

         // c) Asignar 0 a suma
         suma = 0;

         // d) Sumar x a suma y asignar a suma
         suma += x;

         // e) Imprimir mensaje
         document.writeln("<p>La suma es: " + suma + "</p>");
      </script>
   </head>
   <body></body>
</html>
