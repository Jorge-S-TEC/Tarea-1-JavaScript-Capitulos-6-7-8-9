<!DOCTYPE html>
<!-- Ejercicio 7.16: tabla_multiplos.html -->
<html>
   <head>
      <meta charset="utf-8">
      <title>Tabla de potencias</title>
      <style>
         table {
            border-collapse: collapse;
            font-family: sans-serif;
         }
         th, td {
            border: 1px solid #666;
            padding: 6px 14px;
            text-align: center;
         }
         th {
            background-color: #eee;
         }
      </style>
      <script>
         document.writeln("<table>");
         document.writeln("<tr><th>N</th><th>10*N</th><th>100*N</th><th>1000*N</th></tr>");

         var n = 1;
         while (n <= 6)
         {
            document.writeln("<tr><td>" + n + "</td><td>" + (10 * n) + "</td><td>" + (100 * n) + "</td><td>" + (1000 * n) + "</td></tr>");
            n++;
         }

         document.writeln("</table>");
      </script>
   </head>
   <body></body>
</html>
