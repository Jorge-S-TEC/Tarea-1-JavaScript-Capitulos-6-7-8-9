<!DOCTYPE html>
<!-- Ejercicio 7.2: sumar_uno.html -->
<html>
   <head>
      <meta charset="utf-8">
      <title>Ejercicio 7.2 - Cuatro formas de sumar 1</title>
      <script>
         var x;

         document.writeln("<h1>Cuatro formas de sumar 1 a x</h1>");

         x = 5;
         x = x + 1;
         document.writeln("<p>1. x = x + 1; // resultado: " + x + "</p>");

         x = 5;
         x += 1;
         document.writeln("<p>2. x += 1; // resultado: " + x + "</p>");

         x = 5;
         ++x;
         document.writeln("<p>3. ++x; // resultado: " + x + "</p>");

         x = 5;
         x++;
         document.writeln("<p>4. x++; // resultado: " + x + "</p>");
      </script>
   </head>
   <body></body>
</html>
