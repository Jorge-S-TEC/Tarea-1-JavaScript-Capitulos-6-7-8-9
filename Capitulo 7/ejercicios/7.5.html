<!DOCTYPE html>
<!-- Ejercicio 7.5: suma1_a_10.html -->
<html>
   <head>
      <meta charset="utf-8">
      <title>Ejercicio 7.5 - Suma del 1 al 10</title>
      <script>
         var suma;
         var x;

         x = 1;
         suma = 0;

         while (x <= 10)
         {
            suma += x;
            ++x;
         }

         document.writeln("<h1>La suma de los enteros del 1 al 10 es: " + suma + "</h1>");
      </script>
   </head>
   <body></body>
</html>
