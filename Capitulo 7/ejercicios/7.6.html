<!DOCTYPE html>
<!-- Ejercicio 7.6: valores_variables.html -->
<html>
   <head>
      <meta charset="utf-8">
      <title>Ejercicio 7.6 - Determinación de valores</title>
      <script>
         var producto = 5, x1 = 5;
         producto *= x1++;

         var cociente = 5, x2 = 5;
         cociente /= ++x2;

         document.writeln("<h1>Resultados del Ejercicio 7.6</h1>");
         document.writeln("<p><strong>a) producto *= x++;</strong><br>producto = " + producto + ", x = " + x1 + "</p>");
         document.writeln("<p><strong>b) cociente /= ++x;</strong><br>cociente = " + cociente + ", x = " + x2 + "</p>");
      </script>
   </head>
   <body></body>
</html>
