<!DOCTYPE html>
<!-- Ejercicio 7.19: else_suelto.html -->
<html>
   <head>
      <meta charset="utf-8">
      <title>Ejercicio 7.19 - Problema del else suelto</title>
      <script>
         function probarA(x, y) {
            document.writeln("<h4>Segmento a con x=" + x + ", y=" + y + ":</h4>");
            if (x < 10)
               if (y > 10)
                  document.writeln("<p>*****</p>");
               else
                  document.writeln("<p>#####</p>");
            document.writeln("<p>$$$$$</p>");
         }

         function probarB(x, y) {
            document.writeln("<h4>Segmento b con x=" + x + ", y=" + y + ":</h4>");
            if (x < 10)
            {
               if (y > 10)
                  document.writeln("<p>*****</p>");
            }
            else
            {
               document.writeln("<p>#####</p>");
               document.writeln("<p>$$$$$</p>");
            }
         }

         document.writeln("<h1>Resultados del Ejercicio 7.19</h1>");
         probarA(9, 11);
         probarA(11, 9);
         probarB(9, 11);
         probarB(11, 9);
      </script>
   </head>
   <body></body>
</html>
