<!DOCTYPE html>
<!-- Ejercicio 7.15: numero_mayor.html -->
<html>
   <head>
      <meta charset="utf-8">
      <title>Número más grande</title>
      <script>
         var contador = 1;
         var numero;
         var mayor;

         numero = parseInt(window.prompt("Introduzca el número 1 de 10:", "0"));
         mayor = numero;

         while (contador < 10)
         {
            contador++;
            numero = parseInt(window.prompt("Introduzca el número " + contador + " de 10:", "0"));

            if (numero > mayor)
            {
               mayor = numero;
            }
         }

         document.writeln("<h1>El número más grande es: " + mayor + "</h1>");
      </script>
   </head>
   <body></body>
</html>
