<!DOCTYPE html>
<!-- Ejercicio 7.8: ciclo_corregido.html -->
<html>
   <head>
      <meta charset="utf-8">
      <title>Ejercicio 7.8</title>
      <script>
         document.writeln("<h1>Ejercicio 7.8</h1>");
         document.writeln("<p><strong>Error original:</strong> z nunca se decrementa dentro del ciclo, provocando un ciclo infinito. Además, faltan llaves para agrupar las instrucciones.</p>");

         // Código corregido
         var z = 5;
         var suma = 0;

         while (z >= 0)
         {
            suma += z;
            --z;
         }

         document.writeln("<p><strong>Resultado con código corregido:</strong> suma = " + suma + "</p>");
      </script>
   </head>
   <body></body>
</html>
