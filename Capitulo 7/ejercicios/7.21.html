<!DOCTYPE html>
<!-- Ejercicio 7.21: ciclo_infinito.html -->
<html>
   <head>
      <meta charset="utf-8">
      <title>Múltiplos de 2 (Ciclo infinito)</title>
      <script>
         // Advertencia: este programa crea un ciclo infinito como solicita el ejercicio.
         // ¿Qué ocurre? El navegador consumirá CPU y memoria hasta bloquear la pestaña o pedir forzar el cierre.
         var valor = 2;

         while (true)
         {
            document.writeln(valor + "<br>");
            valor = valor * 2;
         }
      </script>
   </head>
   <body></body>
</html>
